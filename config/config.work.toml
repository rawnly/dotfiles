[settings.github]
oauth_client_id = "Iv23liD8jzu2sHUQcjSk"

[dotfiles]
"~/.gitconfig" = { mode = "track" }

[tools]
zizmor = "latest"

[tasks."aws:credentials:update"]
description = "Update CODEARTIFACT_AUTH_TOKEN for java projects"
run = """
aws configure export-credentials --profile default --format env-no-export > .env
token="$(aws codeartifact get-authorization-token --domain satispay --domain-owner $(aws sts get-caller-identity | jq -r .Account) --query authorizationToken --region eu-west-1 --output text 2>&1)"
echo "CODEARTIFACT_AUTH_TOKEN=$token" >> .env
echo "CODEARTIFACT_AUTH_TOKEN set"

mise set -E local CODEARTIFACT_AUTH_TOKEN=$token
"""
