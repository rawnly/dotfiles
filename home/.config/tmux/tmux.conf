#!/usr/bin/env zsh

# source "$HOME/.config/tmux/colors/flexoki-dark.tmuxtheme"

set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin:~/.cargo/bin:/usr/bin:~/.local/bin"

# Set the prefix key to C-a instead of the default C-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# set-option -g default-shell /opt/homebrew/bin/fish
set-option -g default-shell /opt/homebrew/bin/fish
bind Tab last-window 

# if multiple clients area attached to the same window, maximize it to the bigger one 
set-window-option -g aggressive-resize

# Start windows and pane numbering from 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# re number windows when one is closed
set -g renumber-windows on 

# word separators for automatic word selection
setw -g word-separators ' @"()[]_-:,.'
setw -ag word-separators "'"

# show times longer than supposed
set -g display-panes-time 2000 

# tmux messages displaye for 4s 
set -g display-time 4000 

# n?vim compatibility
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:cursor-style"
set -g allow-passthrough on
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'


set -g extended-keys on
set -g extended-keys-format csi-u

# use vim keybindings in copy-mode
setw -g mode-keys vi

# emacs keys in the command prompt (prefix + :) -- was tmux-sensible
set -g status-keys emacs

# Faster command seq
set -s escape-time 0

# have large history
set -g history-limit 5000

# Mouse mode on 
set -g mouse on 


# set Title
set -g set-titles on 
set -g set-titles-string "#T"

# disabled activity monitoring
setw -g monitor-activity off
set -g visual-activity off

 # don't exit from tmux when closing a session
set -g detach-on-destroy off

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# equal resize all panes 
bind = select-layout even-horizontal
bind | select-layout even-vertical 

unbind c
bind c new-window -c "#{pane_current_path}"

# resize panes 
bind J resize-pane -D 10 
bind K resize-pane -U 10 
bind H resize-pane -L 10 
bind L resize-pane -R 10 

# select panes
bind j select-pane -D 
bind k select-pane -U 
bind h select-pane -L 
bind l select-pane -R 

# Settings for VI mode selection in copy-mode
unbind [
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection

unbind p
bind p paste-buffer

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind C-p
unbind C-o
unbind C-k
unbind C-x
unbind C-j
unbind C-g
unbind C-z
unbind v
unbind .
unbind d

# Source file 
bind-key R run-shell " \
  tmux source-file ~/.config/tmux/tmux.conf > /dev/null; \
  tmux display-message 'Sourced tmux.conf!'"

# bind-key . display-popup -b heavy -T "Scratchpad" -d "#{pane_current_path}" -w '80%' -h '80%' -E 'zsh'
bind-key -n -N 'Toggle popup window' F12 if-shell -F '#{==:#{session_name},scratchpad}' {
  detach-client
} {
  display-popup -T Scratchpad -b heavy -d "#{pane_current_path}" -xC -yC -w80% -h75% -E 'tmux new-session -A -s scratchpad'
}


bind-key -N 'Rename Window' , command-prompt -I '#W' -p "name: " "rename-window '%%'" 

# --- inherited from tmux-sensible (plugin removed) ---
bind-key a last-window
bind-key C-n next-window
bind-key C-p previous-window

bind-key -N 'Lazygit' g new-window -n 'GIT' -c "#{pane_current_path}" "lazygit" 
bind-key -N 'Lazygit Split' G split-pane -h -c "#{pane_current_path}" "lazygit" 
bind-key -N 'Lazygit Popup' C-g display-popup -b heavy -S '#[bg=#ffc001]' -d "#{pane_current_path}" -T "LazyGit" -w '50%' -h '75%'  -E "lazygit"

bind-key -N 'Neovim Settings' v new-window -n 'neovim config' -c "$HOME/.config/nvim" "nvim -n"
bind-key -N 'Neovim Settings Split' V split-pane -h -c "$HOME/.config/nvim" "nvim -n"

bind-key -N 'Tmux Settings' t new-window -n '.tmux.conf'  -c "$HOME" "nvim -n .config/tmux/tmux.conf"
bind-key -N 'Tmux Settings Split' T split-pane -h -c "$HOME" "nvim -n .config/tmux/tmux.conf"

# swap panes
unbind C-s
unbind s

bind-key -N 'claude' C-c split-pane -h -c "#{pane_current_path}" "pi"
bind-key -N 'Projects' C-s display-popup -b heavy -S '#[bg=#ffc001]' -d "#{pane_current_path}" -T "Projects" -w '50%' -h '75%'  -E "fish -l -c bvob"
bind-key -N 'expose' s display-popup -b heavy -S '#[bg=#ffc001]' -d "#{pane_current_path}" -w '100%' -h '100%'  -E "tmux-expose --vim"
bind C-t run-shell "workmux sidebar"
bind-key 'S' run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# wezterm integration of folke/zen-mode.nvim
set-option -g allow-passthrough on

set -g @continuum-restore 'off'
set -g @resurrect-strategy-nvim 'session'
set -g @tmux-expose-vim-keys 'on'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'cesarferreira/tmux.expose'
set -g @plugin "jazho76/tmux-statusline"

# Random per-session statusline theme.
# Each new session draws a theme; new windows inherit their session's pick.
set-hook -g session-created 'run -b "~/.config/tmux/scripts/random-statusline-theme.sh \"#{session_name}\""'
set-hook -g after-new-window 'run -b "~/.config/tmux/scripts/random-statusline-theme.sh \"#{session_name}\" reuse"'
# covers the very first session (created before this config was sourced)
set-hook -g client-attached 'run -b "~/.config/tmux/scripts/random-statusline-theme.sh \"#{session_name}\" reuse"'

run -b 'tpack init'
